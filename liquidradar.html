<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiquidRadar - Web3 流动性雷达</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh; color: #fff; overflow-x: hidden;
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { text-align: center; padding: 30px 0; }
        h1 {
            font-size: 3rem;
            background: linear-gradient(90deg, #00d4ff, #ff00ff, #00d4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: gradient 3s linear infinite;
            margin-bottom: 10px;
        }
        @keyframes gradient { 0% { background-position: 0% center; } 100% { background-position: 200% center; } }
        .subtitle { color: #888; font-size: 1.1rem; }
        .stats-bar { display: flex; justify-content: center; gap: 30px; margin: 30px 0; flex-wrap: wrap; }
        .stat-item { text-align: center; padding: 20px 30px; background: rgba(255,255,255,0.05); border-radius: 16px; min-width: 140px; }
        .stat-value { font-size: 2rem; font-weight: bold; background: linear-gradient(90deg, #00d4ff, #ff00ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-label { font-size: 0.9rem; color: #888; margin-top: 5px; }
        .bubble-container { position: relative; width: 100%; height: 600px; margin: 30px 0; background: rgba(0,0,0,0.3); border-radius: 20px; overflow: hidden; }
        .bubble { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.3s; animation: float 6s ease-in-out infinite; }
        .bubble:hover { transform: scale(1.1) !important; box-shadow: 0 0 30px rgba(0,212,255,0.5); z-index: 100; }
        @keyframes float 100% { { 0%, transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .bubble.arb { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
        .bubble.new-pool { background: linear-gradient(135deg, #00d4ff, #0099ff); }
        .bubble.lp { background: linear-gradient(135deg, #a55eea, #8854d0); }
        .bubble-symbol { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .bubble-profit { font-size: 0.9rem; color: rgba(255,255,255,0.9); }
        .legend { display: flex; justify-content: center; gap: 30px; margin: 20px 0; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: rgba(255,255,255,0.05); border-radius: 20px; }
        .legend-dot { width: 12px; height: 12px; border-radius: 50%; }
        .legend-dot.arb { background: #ff6b6b; }
        .legend-dot.new-pool { background: #00d4ff; }
        .legend-dot.lp { background: #a55eea; }
        .filter-tabs { display: flex; justify-content: center; gap: 15px; margin: 20px 0; flex-wrap: wrap; }
        .filter-tab { padding: 10px 24px; background: rgba(255,255,255,0.1); border: none; border-radius: 25px; color: #fff; cursor: pointer; transition: all 0.3s; }
        .filter-tab:hover { background: rgba(255,255,255,0.2); }
        .filter-tab.active { background: linear-gradient(90deg, #00d4ff, #ff00ff); }
        .detail-panel { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; max-width: 500px; background: rgba(20,20,40,0.95); border-radius: 20px; padding: 30px; z-index: 1000; }
        .detail-panel.show { display: block; }
        .detail-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 999; }
        .detail-overlay.show { display: block; }
        .detail-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .detail-title { font-size: 1.5rem; font-weight: bold; }
        .detail-close { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }
        .detail-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .detail-label { color: #888; }
        .detail-value { font-weight: bold; color: #00d4ff; }
        .loading { text-align: center; padding: 100px; color: #888; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .loading { animation: pulse 1.5s infinite; }
        .footer { text-align: center; padding: 30px; color: #666; font-size: 0.9rem; }
        .auto-refresh { text-align: center; color: #666; font-size: 0.85rem; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>LiquidRadar</h1>
            <p class="subtitle">Web3 流动性机会实时监控</p>
            <div class="stats-bar">
                <div class="stat-item"><div class="stat-value" id="totalOps">-</div><div class="stat-label">机会数量</div></div>
                <div class="stat-item"><div class="stat-value" id="arbCount">-</div><div class="stat-label">套利机会</div></div>
                <div class="stat-item"><div class="stat-value" id="poolCount">-</div><div class="stat-label">新池机会</div></div>
                <div class="stat-item"><div class="stat-value" id="lastUpdate">-</div><div class="stat-label">最后更新</div></div>
            </div>
        </header>
        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">全部</button>
            <button class="filter-tab" data-filter="套利">套利</button>
            <button class="filter-tab" data-filter="新池">新池</button>
            <button class="filter-tab" data-filter="LP">LP</button>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot arb"></div><span>套利机会</span></div>
            <div class="legend-item"><div class="legend-dot new-pool"></div><span>新池/新币</span></div>
            <div class="legend-item"><div class="legend-dot lp"></div><span>LP 流动性</span></div>
        </div>
        <div class="bubble-container" id="bubbleContainer"><div class="loading">加载中...</div></div>
        <div class="auto-refresh">数据每 5 分钟自动刷新</div>
        <div class="footer"><p>Powered by OpenClaw + 6551 + Brave + OKX</p><p>OKX OnchainOS AI 松 参赛作品</p></div>
    </div>
    <div class="detail-overlay" id="detailOverlay"></div>
    <div class="detail-panel" id="detailPanel">
        <div class="detail-header"><div class="detail-title" id="detailTitle">详情</div><button class="detail-close" onclick="closeDetail()">&times;</button></div>
        <div id="detailContent"></div>
    </div>
    <script>
        const API_BASE = 'https://raw.githubusercontent.com/wangqingqing99/liquidradar/main';
     let allData = [];
        async function fetchData() {
            try {
                const response =await fetch(`${API_BASE}/data.json`);
                const result = await response.json();
                if (result.success && result.data.opportunities) {
                    allData = result.data.opportunities;
                    renderBubbles(allData);
                    updateStats(result.data);
                }
            } catch (error) {
                document.getElementById('bubbleContainer').innerHTML = '<div class="loading">加载失败，请刷新页面</div>';
            }
        }
        function updateStats(data) {
            const ops = data.opportunities || [];
            document.getElementById('totalOps').textContent = ops.length;
            document.getElementById('arbCount').textContent = ops.filter(o => o.type === '套利').length;
            document.getElementById('poolCount').textContent = ops.filter(o => o.type === '新池').length;
            if (data.lastUpdate) {
                const date = new Date(data.lastUpdate);
                document.getElementById('lastUpdate').textContent = date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
        }
        function renderBubbles(data) {
            const container = document.getElementById('bubbleContainer');
            if (data.length === 0) { container.innerHTML = '<div class="loading">暂无数据</div>'; return; }
            const width = container.offsetWidth;
            const height = container.offsetHeight;
            container.innerHTML = '';
            data.forEach((op, index) => {
                const bubble = document.createElement('div');
                const baseSize = 80;
                const profitNum = parseFloat(op.profit || op.apy || '0');
                const size = baseSize + Math.min(profitNum * 10, 100);
                const x = Math.random() * (width - size - 40) + 20;
                const y = Math.random() * (height - size - 40) + 20;
                bubble.className = 'bubble ' + getTypeClass(op.type);
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                bubble.style.left = x + 'px';
                bubble.style.top = y + 'px';
                bubble.style.animationDelay = (index * 0.5) + 's';
                const pairs = op.pairs ? op.pairs[0].split('/')[0] : op.pool || 'Unknown';
                bubble.innerHTML = '<span class="bubble-symbol">$' + pairs + '</span><span class="bubble-profit">' + (op.profit || op.apy || '-') + '</span>';
                bubble.onclick = () => showDetail(op);
                container.appendChild(bubble);
            });
        }
        function getTypeClass(type) { if (type === '套利') return 'arb'; if (type === '新池') return 'new-pool'; return 'lp'; }
        function showDetail(op) {
            const panel = document.getElementById('detailPanel');
            const overlay = document.getElementById('detailOverlay');
            const title = document.getElementById('detailTitle');
            const content = document.getElementById('detailContent');
            title.textContent = op.type + ' - ' + (op.pairs ? op.pairs[0] : op.pool);
            let html = '<div class="detail-row"><span class="detail-label">类型</span><span class="detail-value">' + op.type + '</span></div>';
            if (op.pairs) html += '<div class="detail-row"><span class="detail-label">交易对</span><span class="detail-value">' + op.pairs.join(', ') + '</span></div>';
            if (op.profit) html += '<div class="detail-row"><span class="detail-label">预期收益</span><span class="detail-value">' + op.profit + '</span></div>';
            if (op.apy) html += '<div class="detail-row"><span class="detail-label">APY</span><span class="detail-value">' + op.apy + '</span></div>';
            if (op.volume) html += '<div class="detail-row"><span class="detail-label">成交量</span><span class="detail-value">' + op.volume + '</span></div>';
            if (op.pool) html += '<div class="detail-row"><span class="detail-label">池子</span><span class="detail-value">' + op.pool + '</span></div>';
            if (op.risk) html += '<div class="detail-row"><span class="detail-label">风险</span><span class="detail-value">' + op.risk + '</span></div>';
            if (op.source) html += '<div class="detail-row"><span class="detail-label">来源</span><span class="detail-value">' + op.source + '</span></div>';
            html += '<div class="detail-row"><span class="detail-label">发现时间</span><span class="detail-value">' + new Date(op.timestamp).toLocaleString('zh-CN') + '</span></div>';
            content.innerHTML = html;
            panel.classList.add('show');
            overlay.classList.add('show');
        }
        function closeDetail() { document.getElementById('detailPanel').classList.remove('show'); document.getElementById('detailOverlay').classList.remove('show'); }
        document.getElementById('detailOverlay').onclick = closeDetail;
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const filter = tab.dataset.filter;
                if (filter === 'all') renderBubbles(allData);
                else renderBubbles(allData.filter(op => op.type === filter));
            });
        });
        fetchData();
        setInterval(fetchData, 5 * 60 * 1000);
    </script>
</body>
</html>
